server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip للضغط لتحسين الأداء
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # منع التخزين المؤقت لملف index حتى تُطبَّق التحديثات
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ملفات الأصول الثابتة بتخزين مؤقت طويل
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # دعم التوجيه من جهة العميل (SPA) — أي مسار يُعاد توجيهه إلى index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
